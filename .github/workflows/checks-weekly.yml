# Every check on every page of the default branch, each Monday (ADR-0019).
# A pull request's checks look only at the pages it alters, so a page no one
# has changed is not looked at again; this run looks at all of them, so a
# change from outside the repository, such as a newer Chrome on GitHub's
# runner, is found within a week rather than in the next change to the
# engine. It blocks nothing: a failed run is the notice, sent to the user
# who last changed the cron line below.
#
# It holds no permissions at all, as a scheduled run must (the owner's
# answer Q2, 2026-10-19; tools/check_workflows.py): it copies the default
# branch by an anonymous clone, as any visitor could, and writes nothing.
# GitHub disables a schedule in a public repository after 60 days without
# activity there (GitHub Docs, "Events that trigger workflows"). Its
# axe-core pin is checks.yml's, which tools/check_workflows.py holds equal.
name: Checks, every page

on:
  schedule:
    # Mondays, 04:41 UTC, before the showcase check at 06:17.
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  every-page:
    # Only here: a copy's own checks run on its every change; the template
    # cleanup deletes this file, and it runs nothing if it stays (ADR-0015).
    if: ${{ github.repository == 'Waqas01CP/portfolio-gallery' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # As in checks.yml: Ubuntu 24.04 restricts the user namespaces
      # Chrome's sandbox uses, and this job holds no token at all (ADR-0010).
      PG_CHROME_NO_SANDBOX: "1"
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Copy the default branch, anonymously
        run: git clone --quiet --depth 1 "https://github.com/$REPOSITORY.git" repo
      - name: Create the environment; pip checks every file's hash
        working-directory: repo
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Fetch axe-core; sha512sum checks it
        env:
          AXE_VERSION: "4.14.0"
          AXE_SHA512: f564d9c448ec67b6f5dd31fc24f99b576cfc0876e5f34ff6866dd73c41b826035d40b2bcd480515e64b11df3003a44aa41e4714ffd1dc0d0f3d863a6df3ce971
        run: |
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/axe-core.tgz" \
            "https://registry.npmjs.org/axe-core/-/axe-core-$AXE_VERSION.tgz"
          echo "$AXE_SHA512  $RUNNER_TEMP/axe-core.tgz" | sha512sum --check --strict
          tar -xzf "$RUNNER_TEMP/axe-core.tgz" -C "$RUNNER_TEMP" package/axe.min.js
      - name: Run every check on every page, axe included
        working-directory: repo
        run: .venv/bin/python tools/ci.py checks --axe "$RUNNER_TEMP/package/axe.min.js"
