# Build and publish with GitHub Pages, on every push to main.
#
# What is built: the gallery when the repository variable
# PORTFOLIO_GALLERY is "true" (set only in the project's own repository),
# and otherwise the site, in the design content/config.json names. A copy
# of this repository therefore publishes its owner's site with no change
# here (docs/how-to/use-this-template.md).
#
# Six jobs, each with the least it needs (ADR-0006, ADR-0010):
#   likes     the gallery only: makes the Likes post in Discussions of any
#             template or showcase site without one, and counts each
#             post's thumbs up for build (ADR-0021); Discussions: write
#             and nothing else; never fails the run over Discussions
#   build     builds and checks the files; read-only; no browser
#   pages     asks GitHub whether Pages is on, publishing from GitHub
#             Actions; Pages: read only. In a copy whose owner has not
#             turned Pages on yet, the run ends with a notice saying how,
#             and publishes nothing, rather than failing red on a
#             stranger's first run; in the gallery an off Pages fails, as
#             does Pages set to publish from a branch (ADR-0015, Changes,
#             2026-10-23). It never holds back build: a build that fails
#             fails the run, whatever Pages says
#   shots     the gallery only: takes each design's preview, makes each
#             showcase entry's served copies from its author's screenshot,
#             and takes the gallery page's own picture, which the README
#             shows, in headless Chrome; read-only; publishes nothing but
#             its own artifact
#   assemble  takes only the WebP pictures the gallery shows from shots,
#             checks them and the site, and packages the site for Pages;
#             read-only
#   deploy    publishes the package, only when pages says Pages is on; the
#             only job that can
# Chrome parses contributed fonts, images and screenshots, so it never runs
# in a job whose output is published without being checked.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  likes:
    if: ${{ vars.PORTFOLIO_GALLERY == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      discussions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Make any missing post; count each post's likes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/likes.py --out likes.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: likes
          path: likes.json
          retention-days: 1
          if-no-files-found: error

  build:
    needs: likes
    # After likes, or without it: in a copy it is skipped, and should it
    # fail, the gallery is built without counts rather than not at all.
    if: ${{ !cancelled() && needs.likes.result != 'cancelled' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Gallery or site
        id: mode
        env:
          GALLERY: ${{ vars.PORTFOLIO_GALLERY }}
        run: |
          if [ "$GALLERY" = "true" ]; then echo "mode=gallery" >> "$GITHUB_OUTPUT"; else echo "mode=site" >> "$GITHUB_OUTPUT"; fi
      - name: Create the environment; pip checks every file's hash
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements.txt
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ needs.likes.result == 'success' }}
        with:
          name: likes
      - name: Build and check
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          if [ "$MODE" = gallery ] && [ -f likes.json ]; then
            .venv/bin/python tools/ci.py build --mode "$MODE" --out _site --likes likes.json
          else
            .venv/bin/python tools/ci.py build --mode "$MODE" --out _site
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: _site
          retention-days: 1
          if-no-files-found: error

  pages:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
    outputs:
      on: ${{ steps.pages.outputs.on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Is GitHub Pages on, publishing from GitHub Actions?
        id: pages
        env:
          GALLERY: ${{ vars.PORTFOLIO_GALLERY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$GALLERY" = "true" ]; then MODE=gallery; else MODE=site; fi
          python3 tools/ci.py pages --mode "$MODE"

  shots:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build.outputs.mode == 'gallery' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PG_CHROME_NO_SANDBOX: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: _site
      # The previews, and each showcase entry's served copies, drawn from
      # its author's screenshot in the repository (ADR-0016, Changes,
      # 2026-10-20). Only those pictures leave this job, gathered into
      # _shots/ with their paths in the site and uploaded whole, as build
      # uploads _site/; assemble checks every one before publishing.
      - name: Take each design's preview, make the showcase's served copies, take the gallery's picture
        run: python3 tools/screenshots.py _site
      - name: Gather only the pictures
        run: |
          mkdir _shots
          cd _site
          cp preview.webp ../_shots/
          cp --parents designs/*/preview.webp ../_shots/
          if [ -d showcase ]; then cp --parents showcase/*/card.webp showcase/*/full.webp ../_shots/; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shots
          path: _shots
          retention-days: 1
          if-no-files-found: error

  # A job that needs a skipped job is skipped too, through the whole chain,
  # unless its own if: holds a status function; one without gets success()
  # added (GitHub Docs, "Using jobs" and "Expressions"). shots is skipped
  # in site mode, so assemble and deploy each say when they run, and name
  # the result of every job they need. tools/check_workflows.py checks it.
  assemble:
    needs: [build, shots]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.shots.result == 'success' || needs.shots.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: _site
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.build.outputs.mode == 'gallery'
        with:
          name: shots
          path: _shots
      - name: Take only checked pictures, and check the site again
        env:
          MODE: ${{ needs.build.outputs.mode }}
        run: |
          if [ "$MODE" = "gallery" ]; then
            python3 tools/ci.py assemble --site _site --shots _shots
          else
            python3 tools/check_built.py _site
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  # Publishes only when pages says Pages is on; with Pages off in a copy,
  # it is skipped and the run ends with pages' notice.
  deploy:
    needs: [assemble, pages]
    if: ${{ !cancelled() && needs.assemble.result == 'success' && needs.pages.result == 'success' && needs.pages.outputs.on == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check that Pages is set to publish from GitHub Actions
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
