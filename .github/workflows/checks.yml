# The content checks (ADR-0006, layer 2): every design, two builds each of
# the site and the gallery compared byte for byte, the built files, the
# content trace and the browser checks, axe-core included (ADR-0011).
#
# The browser checks look only at the pages a change alters (ADR-0019): on
# a pull request, against the base it merges into; on a push to main,
# against the main before it. The gallery is built from that base too, and
# a page whose built files are the same is not checked again. Every page
# is checked when the checks themselves change, when the base cannot be
# read or built, and when the run is started by hand (Actions, Checks, Run
# workflow); checks-weekly.yml checks every page each Monday. The job
# keeps its name, checks, which the ruleset requires, and always runs.
#
# On a pull request from a fork, GitHub runs this with a read-only token and
# no secrets, from the pull request's own copy of this file and of the
# checks. A pull request that changes them fails the scope check, which
# runs from the default branch (scope.yml), and cannot merge.
name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request stops the run for its old commit, which no
# one will merge. On main every run finishes: each merge is checked.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    # A run that checks every page takes about four to five minutes a design
    # on this runner: 3,020 s for twelve on 2026-10-25. A pull request that
    # changes one design checks that design's page alone.
    timeout-minutes: 90
    env:
      # Ubuntu 24.04 restricts the user namespaces Chrome's sandbox uses.
      # This job holds no write token and no secret (ADR-0010).
      PG_CHROME_NO_SANDBOX: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # On a pull request, the merge commit and its first parent, the
          # base, so the showcase step sees what the pull request changed.
          fetch-depth: 2
      - name: Create the environment; pip checks every file's hash
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements.txt
      # The sites a pull request adds or changes, each fetched as a response
      # and never rendered (ADR-0016). Every check below also checks the
      # showcase's files.
      - name: Fetch the showcase sites this pull request adds or changes
        if: ${{ github.event_name == 'pull_request' && hashFiles('tools/check_showcase.py') != '' }}
        run: .venv/bin/python tools/check_showcase.py --fetch-changed HEAD^1
      # axe-core at one exact version, checked against the npm registry's
      # integrity value before anything reads it (ADR-0011). AXE_SHA512 is
      # the registry's sha512-9WTZxEjsZ7b13TH8JPmbV2z8CHbl80/2hm3XPEG4JgNdQLK81IBRXmSxHfMAOkSqQeRxT/0dwNDz2GOm3zzpcQ==
      # written in hex, read 2026-10-15. Only axe.min.js is taken out.
      - name: Fetch axe-core; sha512sum checks it
        env:
          AXE_VERSION: "4.14.0"
          AXE_SHA512: f564d9c448ec67b6f5dd31fc24f99b576cfc0876e5f34ff6866dd73c41b826035d40b2bcd480515e64b11df3003a44aa41e4714ffd1dc0d0f3d863a6df3ce971
        run: |
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/axe-core.tgz" \
            "https://registry.npmjs.org/axe-core/-/axe-core-$AXE_VERSION.tgz"
          echo "$AXE_SHA512  $RUNNER_TEMP/axe-core.tgz" | sha512sum --check --strict
          tar -xzf "$RUNNER_TEMP/axe-core.tgz" -C "$RUNNER_TEMP" package/axe.min.js
      # The base to compare with. A pull request's is the merge's first
      # parent, already here. A push's is the main before it, fetched; a new
      # branch, or a fetch that fails, leaves none, and every page is
      # checked. A run started by hand has none either.
      - name: Find the base this change is compared with
        id: base
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            echo "since=HEAD^1" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = push ] && git fetch --quiet --no-tags --depth=1 origin "$BEFORE"; then
            echo "since=$BEFORE" >> "$GITHUB_OUTPUT"
          fi
      - name: Run every check, axe included, the browser checks on what changed
        env:
          SINCE: ${{ steps.base.outputs.since }}
        run: .venv/bin/python tools/ci.py checks --axe "$RUNNER_TEMP/package/axe.min.js" ${SINCE:+--since "$SINCE"}
